<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Mushraf Khan for opportunities in AI, Machine Learning, and Cloud Development.">
    <meta name="author" content="Mushraf Khan">
    <title>Contact | Mushraf Khan</title>
    <!-- Assuming the same CSS block from index.html goes here -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <header role="banner">
        <h1>Mushraf Khan</h1>
        <p>B.Tech CSE (AI/ML) Student | Aspiring AI Generalist</p>
        <nav aria-label="Primary Navigation" role="navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html" aria-current="page">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main id="main-content" role="main">
        <section aria-labelledby="contact-heading">
            <h2 id="contact-heading">Get In Touch</h2>
            <p>If you'd like to discuss AI opportunities, AWS infrastructure, or collaborative projects, please fill out the form below.</p>

            <!-- Accessible, tab-navigable form -->
            <form action="/submit-endpoint" method="POST" novalidate aria-labelledby="contact-heading">
                
                <div class="form-group">
                    <label for="name">Full Name <span class="required-marker" aria-hidden="true">*</span></label>
                    <input type="text" id="name" name="name" required aria-required="true" autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="email">Email Address <span class="required-marker" aria-hidden="true">*</span></label>
                    <input type="email" id="email" name="email" required aria-required="true" autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject">
                </div>

                <div class="form-group">
                    <label for="message">Message <span class="required-marker" aria-hidden="true">*</span></label>
                    <textarea id="message" name="message" rows="5" required aria-required="true"></textarea>
                </div>

                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>

    <footer role="contentinfo">
        <p>&copy; 2026 Mushraf Khan.</p>
    </footer>
</body>
</html>
